services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nms
      POSTGRES_USER: nms
      POSTGRES_PASSWORD: nms
    ports:
      - "5432:5432"
    volumes:
      - nms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nms -d nms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nms-pgdata:
